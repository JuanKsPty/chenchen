# =============================================================================
# chenchén web
#
# nginx serves the built SPA and proxies /api to the backend, which means the
# browser only ever talks to one origin. That is the reason for the arrangement
# rather than a preference: Vite bakes VITE_* variables in at build time, so an
# absolute API URL compiled into the bundle breaks the moment the stack runs on a
# different host or port. Same-origin also removes CORS from the container path
# entirely — the API's CORS_ORIGINS only matters for `npm run dev`.
# =============================================================================

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress what benefits from it. The woff2 fonts are already compressed and
    # gzipping them again only costs CPU.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    server_tokens off;

    # The app's own pages may never be shown inside another site's frame. The one
    # that matters most is /conectar, where a click hands Claude access: framed by
    # a page that hid it under something else, that click would not be the
    # person's. X-Frame-Options for older browsers, frame-ancestors for the rest.
    #
    # Set in each location that serves the app rather than here: nginx drops the
    # server's add_header in any location that adds one of its own, and the API
    # sets its own headers (/api/ and /.well-known/oauth- below get none of these).
    # `always`, so an error page carries them too.

    # --- the API -------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat streams its answer over server-sent events, and nginx buffers
        # proxied responses by default — which would hold every token until the
        # reply was complete and make a streaming assistant look like a slow one.
        # These four lines are what let a token reach the browser when the server
        # writes it.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding off;

        # Long enough for an SSE turn that pauses while a tool runs; short enough
        # that a wedged upstream does not hold the connection for ever.
        proxy_read_timeout 120s;
    }

    # How Claude finds where to sign in (ADR-0004): the API's discovery
    # documents, which RFC 8414 and RFC 9728 put at the root of the domain, not
    # under /api. Only the OAuth ones; the rest of /.well-known stays the app's.
    # This is the local stack only. In production Traefik sends /api straight to
    # the API and everything else here, so /.well-known needs a Traefik rule of
    # its own to the API (a deploy step: a path /.well-known on the api service's
    # domain in Dokploy), or Claude reads this app's HTML and cannot connect.
    location ^~ /.well-known/oauth- {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the application -----------------------------------------------------

    # Vite fingerprints these filenames, so a URL's contents can never change and
    # the cache never has to be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # The document itself is never cached: it is what names the current asset
    # hashes, so a stale copy pins the browser to a deployment that is gone.
    location = /index.html {
        add_header Cache-Control           "no-cache";
        add_header X-Frame-Options         "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # The web app manifest. The stock mime.types has no entry for .webmanifest,
    # so nginx would send it as application/octet-stream. A `types` block here
    # replaces the inherited map rather than adding to it, so it is emptied and
    # default_type names the one type this location serves. The filename is not
    # fingerprinted, so it is revalidated like the document.
    location ~* \.webmanifest$ {
        types        { }
        default_type application/manifest+json;
        add_header   Cache-Control "no-cache";
        try_files    $uri =404;
    }

    # Client-side routing: /inicio and /cuentas/4001-… are React Router's, not
    # nginx's, so anything that is not a real file falls through to the document
    # (served by the location above, with its headers).
    location / {
        add_header X-Frame-Options         "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
